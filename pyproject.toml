[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fwsim"
version = "1.0.0"
description = "A packet-filtering firewall simulator with stateful tracking, rate limiting, and traffic generation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["firewall", "simulation", "networking", "security", "education"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Topic :: System :: Networking :: Firewalls",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
fwsim = "fwsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fwsim = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
